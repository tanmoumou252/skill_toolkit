    function computeSpecificity(cmd, allowList, denyList) {
      const t = String(cmd || '').trim();
      let bestWhite = null, bestWhiteScore = -1;
      let bestBlack = null, bestBlackScore = -1;

      (allowList || []).forEach((w) => {
        if (w.endsWith('*')) {
          const p = w.slice(0, -1);
          if (t.startsWith(p) && p.length > bestWhiteScore) { bestWhite = w; bestWhiteScore = p.length; }
        } else if ((t === w || t.startsWith(w + ' ')) && (w.length + 100) > bestWhiteScore) {
          bestWhite = w; bestWhiteScore = w.length + 100;
        }
      });

      (denyList || []).forEach((b) => {
        if (b.endsWith('*')) {
          const p = b.slice(0, -1);
          if (t.startsWith(p) && p.length > bestBlackScore) { bestBlack = b; bestBlackScore = p.length; }
        } else if ((t === b || t.startsWith(b + ' ') || t.includes(b)) && (b.length + 100) > bestBlackScore) {
          bestBlack = b; bestBlackScore = b.length + 100;
        }
      });

      let verdict;
      if (bestWhiteScore > bestBlackScore && bestWhiteScore >= 0) {
        verdict = '白名单特异性更高 (' + bestWhiteScore + ' > ' + (bestBlackScore >= 0 ? bestBlackScore : 0) + ') -> 放行';
      } else if (bestBlackScore > bestWhiteScore && bestBlackScore >= 0) {
        verdict = '黑名单特异性更高 (' + bestBlackScore + ' > ' + (bestWhiteScore >= 0 ? bestWhiteScore : 0) + ') -> 拦截';
      } else if (bestWhite && !bestBlack) {
        verdict = '仅匹配白名单 -> 放行';
      } else if (bestBlack && !bestWhite) {
        verdict = '仅匹配黑名单 -> 拦截';
      } else {
        verdict = '未触发自定义特例（按出厂基线策略判定）';
      }
      return { bestWhite: bestWhite, bestWhiteScore: bestWhiteScore, bestBlack: bestBlack, bestBlackScore: bestBlackScore, verdict: verdict };
    }

    function tFind(p) {
      const norm = String(p || '').trim().replace(/^['"]|['"]$/g, '').replace(/^\.\//, '').replace(/^T:[\\/]?/i, '').replace(/\//g, '\\');
      return state.terminalFiles.filter((x) => x.path.toLowerCase() === norm.toLowerCase())[0] || null;
    }
    function tAdd(relPath, content, isDir) {
      const norm = String(relPath).replace(/^[/\\]+/, '').replace(/\//g, '\\');
      let f = tFind(norm);
      if (f) { f.content = content; f.size = content.length; f.updatedAt = Date.now(); }
      else state.terminalFiles.push({ path: norm, size: content.length, content: content, isDirectory: !!isDir, updatedAt: Date.now() });
      if (!isDir && norm.indexOf('\\') !== -1) {
        const dir = norm.split('\\').slice(0, -1).join('\\');
        if (dir && !tFind(dir)) tAdd(dir, '', true);
      }
    }
    function tRemove(pattern) {
      const clean = String(pattern).trim().replace(/^['"]|['"]$/g, '');
      if (clean === '.*' || clean === '*' || clean === './*' || clean === 'T:\\*' || clean === 'T:\\*.*' || clean === './' || clean === '.') {
        state.terminalFiles.length = 0; return;
      }
      const target = clean.replace(/^\.\//, '').replace(/\//g, '\\');
      const lower = target.toLowerCase();
      for (let i = state.terminalFiles.length - 1; i >= 0; i--) {
        const p = state.terminalFiles[i].path.toLowerCase();
        if (p === lower || p.startsWith(lower + '\\')) state.terminalFiles.splice(i, 1);
      }
    }
    function simulateBashWork(cmd) {
      const trimmed = cmd.trim();
      const echoRedirectMatch = trimmed.match(/^echo\s+(["']?)(.*?)\1\s*(>|>>)\s*(.+)$/i);
      if (echoRedirectMatch) {
        const content = echoRedirectMatch[2];
        const isAppend = echoRedirectMatch[3] === '>>';
        const targetFile = echoRedirectMatch[4].trim();
        const existing = (tFind(targetFile) || { content: '' }).content || '';
        const newContent = isAppend ? (existing ? existing + '\n' + content : content) : content;
        tAdd(targetFile, newContent);
        return { stdout: '[浏览器仿真·未执行] [T:\\ 写入成功] ' + targetFile + ' (' + newContent.length + ' 字节)', stderr: '', exitCode: 0 };
      }
      if (trimmed.startsWith('rm ')) {
        const parts = trimmed.split(/\s+/);
        const target = parts[parts.length - 1];
        tRemove(target);
        return { stdout: '[浏览器仿真·未执行] [T:\\ 物理清理] 成功移除: ' + target, stderr: '', exitCode: 0 };
      }
      if (trimmed.startsWith('mkdir ')) {
        const parts = trimmed.split(/\s+/);
        const dirName = parts[parts.length - 1];
        tAdd(dirName, '', true);
        return { stdout: '[浏览器仿真·未执行] [T:\\ 目录创建] 成功建立目录: T:\\' + dirName, stderr: '', exitCode: 0 };
      }
      if (trimmed.startsWith('ls')) {
        const fileList = state.terminalFiles.map((f) => (f.isDirectory ? 'drwxr-xr-x' : '-rw-r--r--') + ' 1 node dev ' + String(f.size).padStart(6) + ' ' + new Date(f.updatedAt || Date.now()).toLocaleTimeString() + ' T:\\' + f.path);
        return { stdout: 'total ' + state.terminalFiles.length + '\n' + fileList.join('\n'), stderr: '', exitCode: 0 };
      }
      if (trimmed.startsWith('cat ')) {
        const target = trimmed.replace(/^cat\s+/, '').trim();
        const f = tFind(target);
        return f ? { stdout: f.content || '(empty file)', stderr: '', exitCode: 0 } : { stdout: '', stderr: 'cat: ' + target + ': No such file in T:\\', exitCode: 1 };

      state.terminalFiles.forEach((f, i) => {
        const sel = state.terminalSelectedFile && state.terminalSelectedFile.path === f.path;
        html += '<button onclick="state.terminalSelectedFile = state.terminalFiles[' + i + ']; render();" class="text-left p-2 rounded-[6px] bg-[var(--bg-surface-elevated)] border ' + (sel ? 'border-[var(--accent-primary)]' : 'border-[var(--border-main)]') + ' flex items-center justify-between text-xs font-mono">';
        html += '<div class="flex items-center gap-2 truncate">' + renderIcon('FileText', 'w-3.5 h-3.5 text-[var(--gold-accent)]') + '<span class="text-[var(--text-main)] truncate">' + esc(f.path) + '</span></div>';
        html += '<span class="text-[10px] text-[var(--text-dim)]">' + f.size + ' B</span></button>';
      });
      html += '</div>';

      if (state.terminalSelectedFile) {
        html += '<div class="mt-2 flex flex-col gap-1"><div class="text-[11px] text-[var(--text-dim)] font-mono truncate">预览: ' + esc(state.terminalSelectedFile.path) + '</div>';
        html += '<pre class="p-2.5 rounded-[6px] bg-[var(--bg-file-viewer)] border border-[var(--border-file-viewer)] text-[11px] font-mono text-[var(--text-file-viewer)] max-h-40 overflow-auto scrollbar-thin">' + esc(state.terminalSelectedFile.content) + '</pre></div>';
      }
      html += '</div></div>';
      return html;
    }

    

    function renderTestsTab() {
      const res = state.regressResult;
      let passCount = 0, failCount = 0;
      if (res && res.stdout) {
        const ok = res.stdout.match(/^OK\s/gm);
        const no = res.stdout.match(/^FAIL\s/gm);
        passCount = ok ? ok.length : 0;
        failCount = no ? no.length : 0;
      }

      let html = '<div class="flex flex-col gap-4">';
      html += '<div class="p-5 rounded-[18px] bg-[var(--bg-surface)] border border-[var(--border-main)] flex flex-wrap items-center justify-between gap-4">';
      html += '<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-[var(--accent-container)] text-[var(--accent-primary)] flex items-center justify-center">' + renderIcon('TestTube2', 'w-5 h-5') + '</div><div>';
      html += '<div class="flex items-center gap-2"><h2 class="text-sm sm:text-base font-semibold font-serif-title text-[var(--text-main)]">安全回归测试（实机真实执行）</h2>';
      if (res) {
        html += '<span class="text-[11px] px-2 py-0.5 rounded-full font-semibold ' + (res.exitCode === 0 ? 'bg-[var(--accent-container)] text-[var(--accent-text)]' : 'bg-[var(--danger-container)] text-[var(--danger-text)]') + '">' + (res.exitCode === 0 ? 'ALL OK (' + passCount + ' passed)' : 'FAILURES (' + failCount + ' failed)') + '</span>';
      }
      html += '</div><p class="text-[11px] text-[var(--text-muted)]">真实派生子进程运行 mcp/tests/plan-governor-regress.mjs，覆盖双实例能力绑定、模式可信验真与 14 族结构硬闸。</p></div></div>';

      html += '<div class="flex items-center gap-2">';
      if (res) {
        html += '<button onclick="copyRegressReport(state.regressResult)" class="px-3 h-9 rounded-[6px] bg-[var(--bg-surface-elevated)] border border-[var(--border-main)] text-xs text-[var(--text-main)] hover:border-[var(--accent-primary)] flex items-center gap-1.5">' + renderIcon('Copy', 'w-3.5 h-3.5') + '<span>复制报告</span></button>';
      }
      html += '<button onclick="triggerRegress()" ' + (state.regressRunning ? 'disabled' : '') + ' class="px-4 h-9 rounded-[6px] bg-[var(--accent-primary)] text-[var(--accent-on-primary)] font-semibold text-xs flex items-center gap-1.5 shadow-sm hover:opacity-90 disabled:opacity-50">';
      html += renderIcon('RotateCw', 'w-3.5 h-3.5 ' + (state.regressRunning ? 'animate-spin' : ''));
      html += '<span>' + (state.regressRunning ? '正在实机执行回归套件...' : '运行真实回归测试') + '</span></button></div></div>';

      if (res) {
        html += '<div class="p-4 rounded-[18px] bg-[var(--bg-surface)] border border-[var(--border-main)] flex flex-col gap-2 animate-in">';
        html += '<div class="flex items-center justify-between text-xs pb-2 border-b border-[var(--border-subtle)]">';
        html += '<div class="flex items-center gap-1.5 font-semibold text-[var(--text-main)]">' + renderIcon(res.exitCode === 0 ? 'CheckCircle2' : 'XCircle', 'w-4 h-4 ' + (res.exitCode === 0 ? 'text-[var(--accent-primary)]' : 'text-[var(--danger-accent)]')) + '<span>套件执行输出 (plan-governor-regress.mjs)</span></div>';
        html += '<div class="text-[11px] font-mono text-[var(--text-dim)]">耗时: ' + (res.durationMs || 0) + 'ms · 退出代码: ' + (res.exitCode !== null ? res.exitCode : '运行中') + (res.truncated ? ' ⚠ 输出已截断' : '') + '</div></div>';
        html += '<pre class="p-3.5 rounded-[8px] bg-[var(--bg-surface-elevated)] text-xs font-mono max-h-[460px] overflow-y-auto scrollbar-thin text-[var(--text-main)] whitespace-pre-wrap">' + esc(res.stdout || '(无标准输出)') + (res.stderr ? '\n--- STDERR ---\n' + esc(res.stderr) : '') + '</pre></div>';
      } else {
        html += '<div class="py-20 text-center text-[var(--text-dim)] bg-[var(--bg-surface)] rounded-[18px] border border-[var(--border-main)] flex flex-col items-center gap-2">';
        html += renderIcon('Lock', 'w-8 h-8 opacity-40');
        html += '<p class="text-xs font-medium">尚未执行真实回归</p>';
        html += '<p class="text-[11px] max-w-sm text-[var(--text-muted)]">点击上方按钮将派生独立 Node 进程运行全量回归套件（耗时分钟量级），结果逐行实时捕获展示。</p></div>';
      }
      html += '</div>';
      return html;
    }

    function renderChallengeDialog() {
      const ch = state.challengeModal;
      let html = '<div class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-in">';
      html += '<div class="bg-[var(--bg-surface)] border border-[var(--border-main)] rounded-[24px] p-6 max-w-md w-full shadow-2xl flex flex-col gap-4">';
      html += '<div class="flex items-start justify-between"><div class="flex items-center gap-3">';
      html += '<div class="w-10 h-10 rounded-[14px] bg-[var(--gold-container)] text-[var(--gold-accent)] flex items-center justify-center">' + renderIcon('AlertTriangle', 'w-5 h-5') + '</div>';
      html += '<div><h3 class="text-sm font-semibold text-[var(--text-main)]">权限放宽二次确认 (2-Step)</h3><p class="text-[11px] text-[var(--text-muted)]">动态码 60 秒内有效</p></div></div>';
      html += '<button onclick="state.challengeModal = null; render();" class="text-[var(--text-dim)] hover:text-[var(--text-main)]">' + renderIcon('X', 'w-4 h-4') + '</button></div>';
      html += '<p class="text-xs text-[var(--text-muted)]">' + esc(ch.message) + '</p>';
      html += '<div><input value="' + esc(ch.code) + '" oninput="state.challengeModal.code = this.value.toUpperCase();" maxlength="6" placeholder="输入 6 位动态验证码" class="w-full h-11 px-3 rounded-[8px] bg-[var(--bg-input)] border border-[var(--border-main)] text-center text-sm font-mono tracking-[0.4em] uppercase text-[var(--text-main)] focus:outline-none focus:border-[var(--accent-primary)]" autofocus />';
      if (ch.error) html += '<p class="text-[11px] text-[var(--danger-accent)] mt-1.5 font-medium">' + esc(ch.error) + '</p>';
      html += '</div>';
      html += '<div class="flex justify-end gap-2 pt-2 border-t border-[var(--border-subtle)]">';
      html += '<button onclick="state.challengeModal = null; render();" class="px-4 py-2 rounded-full text-xs font-semibold text-[var(--text-dim)] hover:bg-[var(--bg-surface-elevated)]">取消</button>';
      html += '<button onclick="confirmChallenge()" class="px-5 py-2 rounded-full text-xs font-semibold bg-[var(--accent-primary)] text-[var(--accent-on-primary)] shadow-sm">提交确认码</button></div></div></div>';
      return html;
    }

    function renderConfirmDialog() {
      const cd = state.confirmDialog;
      let html = '<div class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-in">';
      html += '<div class="bg-[var(--bg-surface)] border border-[var(--border-main)] rounded-[24px] p-6 max-w-md w-full shadow-2xl flex flex-col gap-4">';
      html += '<div class="flex items-start justify-between"><h3 class="text-sm font-semibold text-[var(--text-main)]">' + esc(cd.title) + '</h3>';
      html += '<button onclick="state.confirmDialog = null; render();" class="text-[var(--text-dim)] hover:text-[var(--text-main)]">' + renderIcon('X', 'w-4 h-4') + '</button></div>';
      html += '<p class="text-xs text-[var(--text-muted)]">' + esc(cd.message) + '</p>';
      html += '<div class="flex justify-end gap-2 pt-2 border-t border-[var(--border-subtle)]">';
      html += '<button onclick="state.confirmDialog = null; render();" class="px-4 py-2 rounded-full text-xs font-semibold text-[var(--text-dim)] hover:bg-[var(--bg-surface-elevated)]">取消</button>';
      html += '<button onclick="var fn = state.confirmDialog.onConfirm; state.confirmDialog = null; if(fn) fn(); render();" class="px-5 py-2 rounded-full text-xs font-semibold bg-[var(--danger-accent)] text-white shadow-sm">确认</button></div></div></div>';
      return html;
    }

    function render() {
      const root = document.getElementById('root');
      if (!root) return;
      const activeTheme = THEMES.filter((t) => t.id === state.theme)[0] || THEMES[0];

      let html = renderHeader(activeTheme);
      html += '<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5">';
      if (state.tab === 'governor') html += renderPlaygroundTab();
      else if (state.tab === 'policy') html += renderPolicyTab();
      else if (state.tab === 'terminal') html += renderTerminalTab();
      else if (state.tab === 'tests') html += renderTestsTab();
      html += '</main>';
      html += '<footer class="mt-auto border-t border-[var(--border-main)] bg-[var(--bg-surface)] py-3 px-4 text-center text-xs text-[var(--text-dim)]">Plan-Governor 哨兵 · 双实例 RBAC 隔离 · 黑白名单具体特例覆盖 · 全量审计流水 · 零构建步骤</footer>';

      if (state.toast) {
        const err = state.toast.type === 'error';
        html += '<div class="fixed bottom-5 right-5 z-50 max-w-md px-4 py-2.5 rounded-[10px] text-xs font-medium shadow-2xl flex items-center gap-2 animate-in ' + (err ? 'bg-[var(--danger-container)] text-[var(--danger-text)] border border-[var(--danger-accent)]' : 'bg-[var(--accent-container)] text-[var(--accent-text)] border border-[var(--accent-primary)]') + '">';
        html += renderIcon(err ? 'AlertTriangle' : 'CheckCircle2', 'w-4 h-4') + '<span>' + esc(state.toast.text) + '</span></div>';
      }
      if (state.challengeModal) html += renderChallengeDialog();
      if (state.confirmDialog) html += renderConfirmDialog();

      root.innerHTML = html;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      setTheme(state.theme);
      await loadStatus();
      await loadPolicy();
      await loadAuditLogs();
      setInterval(() => loadAuditLogs(true), 10000);
    });
  </script>
</body>
</html>
